name: Build and publish module

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (vX.Y.Z). Required for manual runs.'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A Release must come from a version tag. A manual run reports the branch
      # in github.ref_name, so refuse to treat a branch name as a tag.
      - name: Resolve release tag
        shell: pwsh
        run: |
          $tag = python tools/uid-seccomp-module/release_tag.py "${{ github.ref }}" "${{ github.ref_name }}" "${{ inputs.tag }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $tag) { throw 'Could not resolve a release tag.' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Android NDK 27.3.13750724
        shell: pwsh
        run: |
          $sdkmanager = Get-ChildItem -Path $env:ANDROID_HOME -Filter sdkmanager.bat -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sdkmanager) {
            throw 'Android sdkmanager.bat was not found on the runner.'
          }
          & $sdkmanager.FullName --licenses | Out-Null
          & $sdkmanager.FullName 'ndk;27.3.13750724'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build arm64-v8a module
        shell: pwsh
        run: python tools/uid-seccomp-module/build.py --module-only

      - name: Verify package
        shell: pwsh
        run: |
          $version = (Select-String -Path 'tools/uid-seccomp-module/build.py' -Pattern "^VERSION = '(.+)'$").Matches.Groups[1].Value
          if (-not $version) { throw 'Could not read VERSION from build.py.' }
          $package = "build/$version/cq-uid-seccomp-$version.zip"
          if (-not (Test-Path $package)) { throw "Missing $package" }
          Get-FileHash $package -Algorithm SHA256
          Get-Content "$package.sha256"
          "PACKAGE=$package" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: UID Filter ${{ env.RELEASE_TAG }}
          generate_release_notes: false
          body: |
            UID Filter arm64-v8a 模块。

            - 支持 Android 13+、Zygisk API 5
            - 过滤指定应用的 `getpriority(PRIO_USER)` 调用
            - 包含中英文 WebUI
          files: |
            ${{ env.PACKAGE }}
            ${{ env.PACKAGE }}.sha256
