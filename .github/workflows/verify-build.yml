name: Verify module build

# Build-verification only: it compiles the module on a Windows runner and checks
# the packaged artifact. It never publishes a Release. Release publishing stays
# in release.yml and is still driven exclusively by a version tag.

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run host tests
        run: sh tools/uid-seccomp-module/tests/run_tests.sh

  build:
    name: Build and verify arm64-v8a module
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android NDK 27.3.13750724
        shell: pwsh
        run: |
          $sdkmanager = Get-ChildItem -Path $env:ANDROID_HOME -Filter sdkmanager.bat -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sdkmanager) {
            throw 'Android sdkmanager.bat was not found on the runner.'
          }
          & $sdkmanager.FullName --licenses | Out-Null
          & $sdkmanager.FullName 'ndk;27.3.13750724'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build arm64-v8a module
        shell: pwsh
        run: python tools/uid-seccomp-module/build.py --module-only

      - name: Verify packaged artifact
        shell: pwsh
        run: |
          function Assert([bool]$cond, [string]$msg) { if (-not $cond) { throw $msg } }

          $version = (Select-String -Path 'tools/uid-seccomp-module/build.py' -Pattern "^VERSION = '(.+)'$").Matches.Groups[1].Value
          Assert ($version) 'Could not read VERSION from build.py.'

          $zip = "build/$version/hma-plus-plus-$version.zip"
          Assert (Test-Path $zip) "Missing module package: $zip"
          Assert (Test-Path "$zip.sha256") "Missing checksum: $zip.sha256"
          Assert ((Get-ChildItem build -Recurse -Filter 'cq-uid-seccomp-*.zip' -ErrorAction SilentlyContinue).Count -eq 0) 'A legacy-named package was produced.'

          $dest = 'build/verify'
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          $prop = Get-Content "$dest/module.prop" -Raw
          Assert ($prop -match "(?m)^id=hma_plus_plus$") 'module.prop id is not hma_plus_plus'
          Assert ($prop -match "(?m)^name=HMA\+\+$") 'module.prop name is not HMA++'
          Assert ($prop -match "(?m)^version=$([regex]::Escape($version))$") "module.prop version is not $version"
          Assert ($prop -match "(?m)^author=zeroedx$") 'module.prop author is not zeroedx'

          $control = Get-Content "$dest/panel/control.sh" -Raw
          Assert ($control -match 'ID=hma_plus_plus') 'control.sh module id is not hma_plus_plus'
          Assert ($control -match 'STORE=/data/adb/hma_plus_plus') 'control.sh store path is not /data/adb/hma_plus_plus'

          $action = Get-Content "$dest/panel/action.sh" -Raw
          Assert ($action -match 'ksu://webui\?id=hma_plus_plus') 'action.sh webui id is not hma_plus_plus'

          $appjs = Get-Content "$dest/panel/webroot/app.js" -Raw
          Assert ($appjs -match '/data/adb/modules/hma_plus_plus/control.sh') 'WebUI script path is not the hma_plus_plus module'

          # No legacy module id or old brand may survive in any packaged text file.
          $tokens = 'cq_uid_seccomp', 'cq-uid-seccomp', 'UID Filter', 'UID 过滤', '泷泽', 'CQ_LANG', 'cq_message', 'cqUidCallback', 'CQUidI18n'
          $hits = Get-ChildItem $dest -Recurse -File -Exclude *.so | Select-String -Pattern $tokens -SimpleMatch -List
          if ($hits) {
            $hits | ForEach-Object { Write-Host "STALE: $($_.Path):$($_.LineNumber): $($_.Line)" }
            throw 'Old identifiers remain in the packaged module.'
          }

          Write-Host "Artifact verified: $zip"

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: hma-plus-plus-module
          path: |
            build/*/hma-plus-plus-*.zip
            build/*/hma-plus-plus-*.zip.sha256
          if-no-files-found: error
